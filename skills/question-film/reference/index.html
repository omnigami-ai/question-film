<!doctype html>

<title>Ostlery · The question stays</title>
<style>
  html, body { margin: 0; height: 100%; background: #17191F; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="kit.js"></script>
<script>
// Question film: the reference film, for Ostlery (STORY.md; the founder approved it on 2026-10-26).
// Style inspired by Spotify's video "Now you can talk to Spotify" (2026, https://www.youtube.com/shorts/Qf-iBP8X7pI):
// an independent style study, not affiliated with or endorsed by Spotify, and none of its assets. Ostlery is a
// fictional company made for omnigami's examples: its app's real screens (captured, assets/screens), its stays'
// photographs (assets/stays), its mark copied exactly from assets/mark.svg.
//
// The device (it travels to any product that answers a request): the whole frame is the product's input box. A request
// fills it, flush left, with the send button in its corner. Sent, the request FOLDS UP into a headline band and the real
// answer rises into the space it leaves, so every answer frame shows the question it answers. The next request REOPENS
// the band down over the answer. A real button in an answer (Book it) can open into the next request itself.
// Sections are labelled KEEP (the machinery: easing, timing, the type rules, the fold, the reopen, the button opening,
// the close) and ADAPT (the brand's tokens, fonts, mark and wordmark, the requests, the captures, the answers' layouts).
// SKILL.md says how. Deterministic: seek(t) paints from its arguments only, on CPU canvases, ctx.reset() first.
(() => {
const { clamp, lerp, loadFont, loadImage } = window.kit;
const W = 1080, H = 1920, FPS = 30, BPM = 132, BEAT = 60 / BPM;
const b = (n) => n * BEAT;
const canvas = document.getElementById('c');
const g = canvas.getContext('2d', { willReadFrequently: true });
// helper canvases (CPU-backed like the film's own): a plane for the 3D turn, and a snapshot layer
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const gb = buf.getContext('2d', { willReadFrequently: true });

// ADAPT: the brand's tokens (Ostlery's brand guide): paper the app's ground, sand its quiet fill (the composer's idle send
// button, the last request's field), card the input's white, ink its text, soft its placeholder grey, line the input's
// hairline, rule a pressed light button, ember the brand's colour and ember2 that colour pressed, ok its success colour
// (the field a button in the answer opens into)
const C = { paper: '#F7F4EE', sand: '#EFEAE1', card: '#FFFFFF', ink: '#17191F', soft: '#80858E', line: '#E3DDD2', rule: '#D6CFC2', ember: '#C2482B', ember2: '#A93B20', ok: '#2E7A57' };
// ADAPT: the product's interface face (every request, headline and label) and the wordmark's face
const SANS = (s, w = 500) => `${Math.round(w)} ${s}px Figtree`;
const SERIF = (s, w = 600) => `${Math.round(w)} ${s}px Newsreader`;
// ADAPT: the mark, copied exactly from assets/mark.svg (viewBox 0 0 100 100; another viewBox: scale it into this box)
const MARK = ['M8 92V50a42 42 0 0 1 84 0v42h-8V50a34 34 0 0 0-68 0v42z', 'M24 92V50a26 26 0 0 1 52 0v42h-8V50a18 18 0 0 0-36 0v42z', 'M40 92V50a10 10 0 0 1 20 0v42z'].map((d) => new Path2D(d));
// ADAPT: the app's own icons (Ostlery's app), copied exactly, 24-unit boxes
const ICON_UP = new Path2D('M12 19V5M6 11l6-6 6 6');
const ICON_CHECK = new Path2D('M5 12.5l4.5 4.5L19 7.5');

// ============================== KEEP: easing ==============================
const r = (t, a, d) => clamp((t - a) / d);
const out3 = (p) => 1 - (1 - clamp(p)) ** 3;
const out5 = (p) => 1 - (1 - clamp(p)) ** 5;
const easeIn = (p) => clamp(p) ** 2.2;
const settle = (p) => kit.motion.settle(clamp(p), 1);
// a CSS-style cubic bezier (x1, y1, x2, y2), solved by bisection: pure, the same answer every frame
function bezier(x1, y1, x2, y2) {
  const at = (s, a, c) => 3 * (1 - s) * (1 - s) * s * a + 3 * (1 - s) * s * s * c + s * s * s;
  return (p) => {
    p = clamp(p);
    if (p <= 0 || p >= 1) return p;
    let lo = 0, hi = 1;
    for (let i = 0; i < 32; i++) { const m = (lo + hi) / 2; if (at(m, x1, x2) < p) lo = m; else hi = m; }
    return at((lo + hi) / 2, y1, y2);
  };
}
// The inspiring film's grammar, measured from it (style.md): entrances arrive at speed and settle on a long tail, exits
// accelerate into the next shot, a move out of a hold starts slowly and snaps through its middle. Extremes:
const EXPO_OUT = bezier(0.16, 1, 0.3, 1);    // arrivals from off frame or from nothing
const EXPO_IO = bezier(0.87, 0, 0.13, 1);    // a move from rest to rest: the fold, the box opening, the button opening
const EXPO_IN = bezier(0.7, 0, 0.84, 0);     // departures
const DRAW = bezier(0.6, 0, 0.3, 1);         // fades and fills: in and out
const MOVE = bezier(0.45, 0, 0.15, 1);       // the composer's glide, the close's moves

// ============================== KEEP: the timeline (s; 132 BPM, a beat 0.4545 s; 66 beats = 30 s) ==============================
const FOLD = 0.78, REOPEN = 0.78, WORD = 0.62;
const T = {
  rise: 0.12, riseDur: 0.62,      // the New trip page rises as a sheet and lands as the ground
  iso: b(3), isoDur: 0.55,        // all but the composer fades into the page's linen; the composer glides to the centre
  type: b(4), perChar: 0.045,     // the hook typed into the real composer, a capture per key
  expand: b(7), expandDur: 0.84,  // the composer opens into the whole frame: the words become the poster
  iris: b(10.25), irisDur: 0.62,  // the send button swells into the first request's field
  press: [b(17.25), b(27), b(37), b(49)],          // send pressed, on the beat
  fold: [0, 0, 0, 0],                              // the request folds into its headline band (press + .1)
  reopen: [0, b(23.5), 0, b(45)],                  // the band reopens over the answer as the next request
  book: b(33),                                     // "Book it" pressed in the answer: it opens into the third request
  booked: b(40), done: b(41),                      // the app books (spinner → Booked), then says it's done
  toComp: b(55), toCompDur: 0.72,               // the last band closes into the composer
  endType: b(56.5), endPerChar: 0.04,
  endPress: b(60) - 0.1, endTurn: b(60), turnOut: 0.17, land: b(61.5),
};
T.fold = T.press.map((p) => p + 0.1);
// the words' fold (one FLIP, every word on one curve): from the fold, except Book it's, which starts on its press so
// its band is settled at the top by 17.2 s (the answer is already in place under it)
const FLIP = 0.55;
T.flip = T.fold.slice(); T.flip[2] = T.press[2];
const BOOK_DIP = 0.08, BOOK_GROW = 0.5;   // Book it dips on the beat, then its rect grows to the frame
T.bookOpen = T.book + BOOK_DIP;
T.glide = T.endTurn + T.turnOut;
const DURATION = b(66);

// ============================== ADAPT: the captures and assets (the hook and the line, the stays) ==============================
const S = {};
let SCR = null;
const K = W / 390;     // the phone page (390 css px) at the frame's width
const HOOK_TEXT = 'Tell Ostlery the trip.';
const LINE_TEXT = 'Plan a stay in a sentence.';
const STAYS = ['heron-point', 'larch-hollow', 'alder-bay', 'quarry-lake', 'millpond', 'stonecrop'];
const FOCUS = { 'heron-point': [0.32, 0.5], 'larch-hollow': [0.5, 0.5], 'alder-bay': [0.56, 0.5], 'quarry-lake': [0.52, 0.45], millpond: [0.45, 0.45], stonecrop: [0.5, 0.5], 'heron-inside': [0.62, 0.5] };

// ============================== KEEP: drawing helpers ==============================
function field(c, colour) { c.fillStyle = colour; c.fillRect(0, 0, W, H); }
function rrect(c, x, y, w, h, rad) { kit.roundRect(c, x, y, w, h, Math.max(0, Math.min(rad, w / 2, h / 2))); }
function disc(c, x, y, rad, colour) { if (rad <= 0) return; c.beginPath(); c.arc(x, y, rad, 0, 2 * Math.PI); c.fillStyle = colour; c.fill(); }
function icon(c, path, x, y, size, colour, stroke) {
  c.save(); c.translate(x - size / 2, y - size / 2); c.scale(size / 24, size / 24);
  c.strokeStyle = colour; c.lineWidth = stroke * 24 / size; c.lineCap = 'round'; c.lineJoin = 'round'; c.stroke(path); c.restore();
}
function mix(a, bb, p) {
  const A = parseInt(a.slice(1), 16), B2 = parseInt(bb.slice(1), 16);
  const ch = (s) => Math.round(lerp((A >> s) & 255, (B2 >> s) & 255, clamp(p)));
  return '#' + [ch(16), ch(8), ch(0)].map((v) => v.toString(16).padStart(2, '0')).join('');
}
const logLerp = (a, bb, p) => Math.exp(lerp(Math.log(a), Math.log(bb), p));
// a soft contact shadow under a card or photo (fixed blur: deterministic on the CPU canvas)
function shadow(c, k = 1) {
  if (k <= 0) { c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0; return; }
  c.shadowColor = `rgba(23,25,31,${(0.28 * k).toFixed(4)})`; c.shadowBlur = 60 * k; c.shadowOffsetY = 22 * k;
}
// only the shadow of a rounded rect (the rect itself drawn far off frame): for planes copied without one
function shadowOnly(c, x, y, w, h, rad, k) {
  if (k <= 0.002) return;
  c.save(); shadow(c, k); c.shadowOffsetX = 4000; rrect(c, x - 4000, y, w, h, rad); c.fillStyle = '#000'; c.fill(); c.restore();
}
// a capture's region (css px within the capture) drawn at dx, dy with css scale s
function shot(c, name, sx, sy, sw, sh, dx, dy, s) {
  const cap = SCR.captures[name], img = S[name], k = cap.scale;
  c.drawImage(img, sx * k, sy * k, sw * k, sh * k, dx, dy, sw * s, sh * s);
}
// a panel: a capture region on a shadowed rounded card
function card(c, name, sx, sy, sw, sh, dx, dy, s, rad, k = 1) {
  c.save(); shadow(c, k); rrect(c, dx, dy, sw * s, sh * s, rad); c.fillStyle = C.paper; c.fill(); c.restore();
  c.save(); rrect(c, dx, dy, sw * s, sh * s, rad); c.clip(); shot(c, name, sx, sy, sw, sh, dx, dy, s); c.restore();
}
// a photograph in a rounded frame, rotated about its centre
function photo(c, name, cx, cy, w, h, rot = 0, o = {}) {
  const rad = o.radius ?? w * 16 / 236;
  c.save(); c.translate(cx, cy); c.rotate(rot);
  if (o.shadowK) { c.save(); shadow(c, o.shadowK); rrect(c, -w / 2, -h / 2, w, h, rad); c.fillStyle = '#000'; c.fill(); c.restore(); }
  rrect(c, -w / 2, -h / 2, w, h, rad); c.clip();
  kit.drawCover(c, S[name], -w / 2, -h / 2, w, h, o.focus || FOCUS[name] || [0.5, 0.5]);
  c.restore();
}
// the app's send button (a disc, an up arrow) at any size; stroke as a share of the radius
function sendButton(c, x, y, rad, bg, fg, stroke = 0.11, iconK = 1.1) {
  if (rad <= 0.5) return;
  disc(c, x, y, rad, bg); icon(c, ICON_UP, x, y, rad * iconK, fg, rad * stroke);
}
// a press: sinks and changes tone on the beat, then eases back
function press(t, at) {
  const d = t - at;
  if (d < 0) return { s: 1, dark: 0 };
  if (d < 0.07) { const p = out3(d / 0.07); return { s: lerp(1, 0.9, p), dark: p }; }
  const p = settle((d - 0.07) / 0.24);
  return { s: lerp(0.9, 1, p), dark: 1 - p };
}

// ---------- the 3D turn: a plane drawn into buf, copied in strips with perspective ----------
const FOCAL = 2300;
function turnY(c, src, box, cx, cy, angle) {
  const { x, y, w, h } = box, n = Math.max(8, Math.ceil(w / 4));
  const cos = Math.cos(angle), sin = Math.sin(angle);
  const px = (u) => { const z = u * sin, s = FOCAL / (FOCAL + z); return [cx + u * cos * s, s]; };
  for (let i = 0; i < n; i++) {
    const x0 = x + (i * w) / n, x1 = x + ((i + 1) * w) / n;
    const [X0, s0] = px(x0 - cx), [X1, s1] = px(x1 - cx);
    const s = (s0 + s1) / 2, top = cy + (y - cy) * s, bot = cy + (y + h - cy) * s;
    const dx = Math.min(X0, X1), dw = Math.abs(X1 - X0) + 0.75;
    if (dw < 0.2) continue;
    c.drawImage(src, x0, y, x1 - x0, h, dx, top, dw, bot - top);
  }
}
function intoBuf(draw, shade = 0) {
  gb.reset(); draw(gb);
  if (shade > 0) { gb.globalCompositeOperation = 'source-atop'; gb.fillStyle = `rgba(23,25,31,${shade.toFixed(3)})`; gb.fillRect(0, 0, W, H); gb.globalCompositeOperation = 'source-over'; }
  return buf;
}

// ============================== KEEP: type, requests set flush left, word by word ==============================
// One set of rules for every request and its headline: the interface face at 880, tracking -0.035 em, leading 0.98
// (enough that descenders clear the line below: the film's checks measure it), flush left on a 64 px margin. A layout is a list of words with their own pose, so any word can travel from one layout to another.
const MARGIN = 64, TRACK = -0.035, LEAD = 0.98, WT = 880, MEASURE = W - 2 * MARGIN;
let CAP_R = 0.7;
// "A weekend / lake cabin," → lines of words; *word* is the accent
function parseLines(text) {
  return String(text).split(/\s+\/\s+/).map((ln) => ln.trim().split(/\s+/).filter(Boolean).map((w) => {
    const acc = /^\*.*\*$/.test(w);
    return { t: acc ? w.slice(1, -1) : w, acc };
  })).filter((ln) => ln.length);
}
function lineWidth(c, ln, size) {
  c.font = SANS(size, WT); c.letterSpacing = `${TRACK * size}px`;
  const sp = c.measureText(' ').width;
  return ln.reduce((a, w, k) => a + (k ? sp : 0) + c.measureText(w.t).width, 0);
}
// balanced breaks of one run of words into n lines (by width), preferring a break after a comma
function breakInto(c, words, n) {
  if (n <= 1 || words.length < 2) return [words];
  let best = null;
  const rec = (start, left, acc) => {
    if (left === 1) { const lines = [...acc, words.slice(start)]; const ws = lines.map((l) => lineWidth(c, l, 100)); const commas = lines.slice(0, -1).filter((l) => /,$/.test(l[l.length - 1].t)).length; const score = Math.max(...ws) - commas * 40; if (!best || score < best.score) best = { score, lines }; return; }
    for (let i = start + 1; i <= words.length - left + 1 - 0; i++) { if (words.length - i < left - 1) break; rec(i, left - 1, [...acc, words.slice(start, i)]); }
  };
  rec(0, n, []);
  return best.lines;
}
const layCache = new Map();
// o: { max, top | cy, maxLines, availH, auto (rewrap even if the text has breaks) }
function layout(c, text, o) {
  const key = JSON.stringify([text, o]);
  if (layCache.has(key)) return layCache.get(key);
  let lines = parseLines(text);
  const all = lines.flat();
  if (o.auto || lines.length === 1 && o.maxLines > 1) {
    let pick = null;
    for (let n = 1; n <= Math.min(o.maxLines || 5, all.length); n++) {
      const ls = breakInto(c, all, n);
      const size = Math.min(o.max, ...ls.map((l) => 100 * MEASURE / lineWidth(c, l, 100)), o.availH ? o.availH / (LEAD * (n - 1) + 1.05) : 1e9);
      if (!pick || size > pick.size * 1.15) pick = { size, ls }; // another line only when it buys real size
    }
    lines = pick.ls;
  }
  const size = Math.max(40, Math.min(o.max, ...lines.map((l) => 100 * MEASURE / lineWidth(c, l, 100))));
  const n = lines.length;
  const top = o.top ?? (o.cy - ((n - 1) * LEAD * size) / 2 - size * 0.36);
  const out = [];
  c.font = SANS(size, WT); c.letterSpacing = `${TRACK * size}px`;
  const sp = c.measureText(' ').width;
  lines.forEach((ln, i) => {
    let x = MARGIN;
    const base = top + CAP_R * size + i * LEAD * size;
    ln.forEach((w, k) => { if (k) x += sp; const width = c.measureText(w.t).width; out.push({ t: w.t, acc: w.acc, x, base, width, line: i, size }); x += width; });
  });
  c.letterSpacing = '0px';
  const L = { size, words: out, lines: n, top, bottom: top + CAP_R * size + (n - 1) * LEAD * size };
  layCache.set(key, L);
  return L;
}
function drawWord(c, text, x, base, size, wt, col, track = TRACK) {
  c.font = SANS(size, wt); c.letterSpacing = `${track * size}px`; c.fillStyle = col; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  c.fillText(text, x, base);
  c.letterSpacing = '0px';
}
// a word rising into its own line, clipped to that line's slot, its weight filling in during the same move
function riseWord(c, w, e, col) {
  if (e <= 0) return;
  const s = w.size;
  c.save(); c.beginPath(); c.rect(0, w.base - s * 1.02, W, s * 1.36); c.clip();
  drawWord(c, w.t, w.x, w.base + s * (1 - e), s, lerp(360, WT, e), col);
  c.restore();
}

// ============================== ADAPT: the hook, the requests' fields and colours, the bands' heights ==============================
const BAND_MAX = 120, BAND_R = 56;
const HOOK = { text: 'Tell / *Ostlery* / the / trip.', ink: C.ink, acc: C.ember, max: 420 };
// each request: its field, type, accent and send button colours; its band's height above the answer
const REQ = [
  { id: 'q1', bg: C.ember, ink: C.paper, acc: C.paper, btn: C.paper, arrow: C.ember, dark: C.rule, bh: 440, max: 400 },
  { id: 'q2', bg: C.ink, ink: C.paper, acc: C.paper, btn: C.ember, arrow: '#FFFFFF', dark: C.ember2, bh: 330, max: 400 },
  { id: 'q3', bg: C.ok, ink: C.paper, acc: C.paper, btn: C.paper, arrow: C.ok, dark: C.rule, bh: 330, max: 400 },
  { id: 'q4', bg: C.sand, ink: C.ink, acc: C.ember, btn: C.ember, arrow: '#FFFFFF', dark: C.ember2, bh: 330, max: 330 },
];
const SEND_BIG = { x: W - MARGIN - 90, y: H - MARGIN - 90, r: 90 };
const Q3_TEXT = 'Book it'; // the app's own button label, so it is not an editable field
function reqText(values, i) { return i === 2 ? Q3_TEXT : String(values[REQ[i].id] ?? ''); }
const bigLay = (c, values, i) => {
  const o = { max: REQ[i].max, top: MARGIN + 70, maxLines: i === 2 ? 1 : 5, availH: SEND_BIG.y - SEND_BIG.r - 60 - (MARGIN + 70) };
  if (i !== 2) return layout(c, reqText(values, i), o);
  // Book it is the button grown to the frame: its label stays centred on its capitals, so it settles in the
  // frame's centre (one line that fills the measure, its cap middle on H / 2)
  const size = layout(c, Q3_TEXT, o).size;
  return layout(c, Q3_TEXT, { ...o, top: H / 2 - CAP_R * size / 2 });
};
const bandLay = (c, values, i) => layout(c, reqText(values, i).replace(/\s+\/\s+/g, ' '), { max: BAND_MAX, cy: REQ[i].bh / 2 + 8, maxLines: 2, auto: true });
const hookLay = (c) => layout(c, HOOK.text, { max: HOOK.max, top: MARGIN + 70 });
const colOf = (st, w) => (w.acc ? st.acc : st.ink);

// the band (a request folded up): its rounded foot at `edge`, its top beyond the frame
function bandShape(c, edge, rad, colour, k) {
  c.save(); shadow(c, k); rrect(c, 0, -120, W, edge + 120, rad); c.fillStyle = colour; c.fill(); c.restore();
}
function clipBand(c, edge, rad) { rrect(c, 0, -120, W, edge + 120, rad); c.clip(); }
// ============================== KEEP: the fold's machinery ==============================
// the band's lift (folds 1, 2, 4) and the hook's box start 22 % into their move
const LAG = 0.22;
// A FLIP: every word of a layout on ONE progress k (one curve, one start, no per-word or per-line stagger). Each word's
// left baseline goes in a straight line from its place in one layout to its place in the other, and its size goes
// linearly from one layout's size to the other's, so at every frame all words share one scale (words that share a
// line in both layouts keep their spacing). Line breaks change only because each word travels to its new place.
// k may be { x, y }: the across move (with the size) leads and the rise follows, so a word bound for the line above
// slides clear of the words already there before it climbs, and no two words ever print over each other (founder
// review, 2026-10-26); all words still share one scale on every frame.
function flipWord(c, a, bb, k, col, wt = [WT, WT], track = [TRACK, TRACK]) {
  const kx = typeof k === 'number' ? k : k.x, ky = typeof k === 'number' ? k : k.y;
  drawWord(c, a.t, lerp(a.x, bb.x, kx), lerp(a.base, bb.base, ky), lerp(a.size, bb.size, kx), lerp(wt[0], wt[1], kx), col, lerp(track[0], track[1], kx));
}
// the fold's two progresses: across from the press over 70 % of the move; the rise waits 0.3 s, until the band has
// come up close under the words, then lands with it (founder, 2026-10-26: ":08 … feels too disjointed")
const foldK = (t, at, dur) => ({ x: EXPO_IO(r(t, at, dur * 0.7)), y: EXPO_IO(r(t, at + 0.3, 0.48)) });

// ============================== the opening: the product's page, its composer, typing (KEEP the moves; ADAPT the captures) ==============================
const COMP = { x: 20 * K, y: 312.52 * K, w: 350 * K, h: 262.5 * K, r: 28 * K };
const COMP_C = { x: (W - 350 * K) / 2, y: (H - 262.5 * K) / 2 };
const TXT = { x: 25, size: 18, base: (13 + 8) + 19.2 };
const SEND = { x: 289 + 24, y: 201.5 + 24, r: 24 };
function composerAt(t) {
  const p = MOVE(r(t, T.iso + 0.04, 0.62));
  return { x: lerp(COMP.x, COMP_C.x, p), y: lerp(COMP.y, COMP_C.y, p) };
}
function typedCount(t, at, text, per = T.perChar) { return Math.floor(clamp((t - at) / per, 0, text.length)); }
function drawComposer(c, x, y, scale, name, n, sendLit, pr) {
  const cap = n > 0 ? `${name}-${String(n).padStart(2, '0')}` : 'composer';
  c.save(); rrect(c, x, y, 350 * scale, 262.5 * scale, 28 * scale); c.clip();
  // an empty field shows no placeholder (the founder, 2026-10-26: too short to read in the close): the capture is drawn
  // around the placeholder's area, which takes the card's white (so nothing shows through while the field fades in)
  if (n === 0 && name === 'line') {
    const hx = x + 14 * scale, hy = y + 8 * scale, hw = 300 * scale, hh = 72 * scale;
    c.fillStyle = C.card; c.fillRect(hx, hy, hw, hh);
    c.beginPath(); c.rect(x, y, 350 * scale, 262.5 * scale); c.rect(hx, hy, hw, hh); c.clip('evenodd');
  }

function cues() {
  const out = [];

  for (let i = 0; i < LINE_TEXT.length; i++) out.push({ t: T.endType + i * T.endPerChar, type: 'tick', gain: 0.32 });
  const swish = (t, travel, gain = 0.26) => out.push({ t, type: 'swish', gain, motion: { kind: 'container', travel } });
  // EXPO_IO moves show their first visible travel ~.2 s in: the sound starts there
  swish(T.expand + 0.2, 0.8, 0.24);
  swish(T.iris + 0.1, 1.0, 0.26);
  T.press.forEach((p) => out.push({ t: p, type: 'tap', gain: 0.55 }));
  T.flip.forEach((f) => swish(f + 0.18, 0.8, 0.26)); // the words' FLIP shows its first travel ~.18 s in
